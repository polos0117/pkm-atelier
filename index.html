<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101925">
<title>제목 미정</title>
<!--
  들머리. 아직 놀이가 정해지지 않았다 — 이 파일은 공통 껍데기가 실제로 서는지
  보여 주는 자리이자, 화면을 더할 때 베낄 본이다.

  주제와 무관한 것만 들어 있다:
    lib/workspace.css      공통 껍데기 (테마 여덟 · 밀도 둘)
    lib/workspace-theme.js 테마·밀도를 그리기 전에 정한다
    lib/workspace-ui.js    테마 고르개 · 큰 제목(문장 포함)
    lib/words.js           화면에 뜨는 말은 전부 여기서 온다
    lib/fresh.js           새 판 감지
    lib/img.js             그림 주소 규칙 (그림은 딴 저장소)
-->
<link rel="stylesheet" href="lib/workspace.css">
<script src="lib/workspace-theme.js"></script>
<script src="lib/words.js"></script>
<script src="lib/fresh.js"></script>
<script src="lib/img.js"></script>
</head>
<body class="prompt-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { AppearanceControls, WorkspaceHeading } from './lib/workspace-ui.js';
const html = htm.bind(h);
const W = window.W;

function App() {
  const [ok] = useState(() => ({
    words: typeof window.AtelierWords === 'object',
    fresh: typeof window.AtelierFresh === 'object',
    img:   typeof window.AtelierImg === 'object',
    theme: typeof window.AtelierAppearance === 'object',
  }));
  return html`
    <${AppearanceControls} />
    <nav class="workspace-nav">
      <a href="index.html" aria-current="page">${W('nav.index')}</a>
      <a href="dex.html">${W('nav.dex')}</a>
    </nav>
    <${WorkspaceHeading} title=${W('app.title')} code=${W('app.code')}
      subtitle=${W('app.subtitle')} />
    <div class="panel"><div class="form-section">
      <p class="sec">${W('boot.layer')}</p>
      ${Object.entries(ok).map(([k, v]) => html`
        <div key=${k}>${v ? '✓' : '✗'} lib/${k === 'theme' ? 'workspace-theme' : k}.js</div>`)}
      <p class="sec" style="margin-top:12px">${W('boot.next')}</p>
      ${[1, 2, 3].map(n => html`<div key=${n}>${W('boot.step' + n)}</div>`)}
    </div></div>`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
