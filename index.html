<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f3">
<title>포켓몬 메카 연구소</title>
<link rel="stylesheet" href="lib/workspace.css?v=pokemon1">
<script src="lib/workspace-theme.js?v=pokemon1"></script>
<script src="lib/words.js?v=pokemon1"></script>
<script src="lib/fresh.js?v=4"></script>
</head>
<body class="prompt-page lab-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {AppearanceControls,WorkspaceHeading,ThemeGallery} from './lib/workspace-ui.js?v=pokemon1';
const W=window.W;
function App(){
  return h('div',null,
    h(WorkspaceHeading,{title:W('app.title'),code:W('app.code'),subtitle:W('app.subtitle')}),
    h('nav',{class:'workspace-nav'},h('a',{href:'index.html','aria-current':'page'},W('nav.index')),
      h('a',{href:'dex.html'},W('nav.dex')),h('a',{href:'prompt.html'},W('prompt.title'))),
    h(AppearanceControls),
    h('div',{class:'lab-intro'},h('div',null,h('h2',null,W('home.title')),h('p',null,W('home.intro'))),
      h('span',{class:'lab-tag'},W('home.tag'))),
    h('div',{class:'lab-links'},['dex','prompt'].map(key=>
      h('a',{class:'lab-link',href:key+'.html',key},
        h('small',null,W('home.'+key+'.code')),h('h3',null,W('home.'+key+'.title')),
        h('p',null,W('home.'+key+'.note')),h('span',{class:'lab-arrow','aria-hidden':'true'},'↗')))),
    h(ThemeGallery));
}
render(h(App),document.getElementById('app'));
</script>
</body>
</html>
