name: 그림 등록

# 그림 저장소(pkm-atelier-img)의 img/ 를 읽어 data/img.json 에 적고 되커밋한다.
# 그림 저장소의 푸시가 이 저장소를 직접 깨우지는 못한다(권한이 없다) — 그래서 한 시간마다
# 돌고, 기다리기 싫으면 Actions 에서 "Run workflow" 를 누른다. 달라진 것이 없으면 커밋하지
# 않는다. 썸네일은 그림 저장소의 워크플로가 만든다.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: '적혀 있는데 파일이 없는 항목도 지운다'
        type: boolean
        default: false

concurrency:
  group: register-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 그림 저장소를 옆에 받아 img/ 로 잇는다. img/ 는 .gitignore 라 커밋에 안 들어간다
      - uses: actions/checkout@v4
        with:
          repository: polos0117/pkm-atelier-img
          path: img-repo

      - name: 그림 자리 잇기
        run: ln -s img-repo/img img && ls img | head -20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 무엇이 달라지는지 먼저 찍어 둔다. 이름이 틀린 파일이 있으면 여기서 실패한다
      - name: 대조
        run: python3 tools/register-images.py --check

      - name: 등록
        run: |
          if [ "${{ inputs.prune }}" = "true" ]; then
            python3 tools/register-images.py --prune
          else
            python3 tools/register-images.py
          fi

      # 자료·등록기·화면이 같은 말을 하는지 — 깨지면 커밋하지 않는다
      - name: 검사
        run: node tests/forms.cjs

      - name: 되커밋
        run: |
          if git diff --quiet -- data/img.json; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/img.json
          git commit -m "자동 등록: 그림 저장소의 새 그림을 data/img.json 에 [skip actions]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
