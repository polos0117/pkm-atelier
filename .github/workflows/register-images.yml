name: 그림 등록

# 그림 저장소(pkm-atelier-img, pkm-atelier-img-2, pkm-atelier-img-3)의 img/ 를 읽어 data/img.json 에 적고 되커밋한다.
# 저장소 차례는 lib/img.js 의 BASES·tools/register-images.py 의 SHARDS 와 같다(tests/img-shards.cjs 가 맞춰 본다).
# 깨우는 길은 셋이다.
#   repository_dispatch — 그림 저장소의 썸네일 워크플로가 끝나면서 보낸다(토큰이 있을 때).
#   schedule            — 뒤받침. GitHub 시간표는 자주 밀리고 빠진다(8시간에 1번 돈 적이 있다).
#   workflow_dispatch   — 기다리기 싫으면 Actions 에서 "Run workflow".
# 달라진 것이 없으면 커밋하지 않는다. 썸네일은 그림 저장소의 워크플로가 만든다.
on:
  repository_dispatch:
    types: [images-updated]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: '적혀 있는데 파일이 없는 항목도 지운다'
        type: boolean
        default: false

concurrency:
  group: register-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 그림 저장소를 옆에 받아 img/ 로 잇는다. img/ 는 .gitignore 라 커밋에 안 들어간다
      - uses: actions/checkout@v4
        with:
          repository: polos0117/pkm-atelier-img
          path: img-repo

      # 둘째 저장소 — 아직 없거나 못 받아도 등록은 돈다(등록기가 "못 받은 저장소" 로 보고 자리를 지킨다)
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: polos0117/pkm-atelier-img-2
          path: img-repo-2

      # 셋째 저장소(2026-10-23 부터 열림) — 받는 길은 둘째와 같다
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: polos0117/pkm-atelier-img-3
          path: img-repo-3

      - name: 그림 자리 잇기
        run: |
          ln -s img-repo/img img && ls img | head -20
          if [ -d img-repo-2/img ]; then ln -s img-repo-2/img img-2 && ls img-2 | head -5; else echo "pkm-atelier-img-2 없음 — 새 그림은 첫 저장소로"; fi
          if [ -d img-repo-3/img ]; then ln -s img-repo-3/img img-3 && ls img-3 | head -5; else echo "pkm-atelier-img-3 없음 — 새 그림은 둘째 저장소로"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 무엇이 달라지는지 먼저 찍어 둔다. 이름이 틀린 파일이 있으면 여기서 실패한다
      - name: 대조
        run: python3 tools/register-images.py --check

      - name: 등록
        run: |
          if [ "${{ inputs.prune || github.event.client_payload.prune }}" = "true" ]; then
            python3 tools/register-images.py --prune
          else
            python3 tools/register-images.py
          fi

      # 일상컷 생김새 색인(data/casual-look.json) — 새 슬롯 또는 이미지 저장소의 교체 알림일 때. 일상컷 계획기가 생김새가 몰린 장면·구도·옷에 벌점을 준다.
      # Rust 가 실패해도 등록은 커밋한다(색인은 하루 늦어도 계획기가 돈다)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: casual-look-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/*.rs', 'rust/**/Cargo.toml') }}
          restore-keys: casual-look-${{ runner.os }}-
      - name: 일상컷 생김새 색인
        continue-on-error: true
        run: |
          if [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ] && git diff --quiet -- data/img.json; then echo "새 그림 없음 — 색인 그대로"; exit 0; fi
          (cd rust && cargo build --release -p casual-look)
          ./rust/target/release/casual-look index

      # 자료·등록기·화면이 같은 말을 하는지 — 깨지면 커밋하지 않는다
      - name: 검사
        run: |
          node tests/forms.cjs
          node tests/img-shards.cjs
          python3 tests/register-images.py

      - name: 되커밋
        run: |
          if git diff --quiet -- data/img.json data/casual-look.json; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/img.json data/casual-look.json
          git commit -m "자동 등록: 그림 저장소의 새 그림을 data/img.json 에 [skip actions]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
