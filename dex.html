<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f3">
<title>포켓몬 메카 연구소</title>
<!--
  도감. 이 놀이에서 한 캐릭터는 여러 장으로 쪼개지지 않고 장갑을 갈아 입는다.
  위쪽은 일반 장갑 셋, 아래쪽은 같은 장갑의 폭주 상태를 나란히 견준다.

  화면은 data/img.json 에 적힌 것만 그린다. 그림 저장소에 파일이 있어도
  tools/register-images.py 를 거치기 전에는 없는 것으로 본다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..800&amp;display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="lib/workspace.css?v=status1">
<style>
/* 색·밀도 토막은 lib/workspace.css 한 곳에 있다. 여기는 뼈대만 —
   workspace.css 의 .dex-page 규칙이 이 뼈대에 살을 붙인다.
   --cc 만 그쪽에 없어 여기서 준다 (카드 테두리 색. 묶음 색이 정해지면 그쪽이 채운다) */
:root {--cc:var(--line)}
* {box-sizing:border-box}
html,body {margin:0;padding:0}
body {color:var(--text);font-size:15px}
/* 목록은 껍데기가 정한 자리(.collection-scroll)에서만 구른다.
   이걸 안 쓰면 .dex-page 가 100dvh 로 잠겨 있어 아래쪽이 통째로 잘린다 —
   화면은 멀쩡해 보이고 스크롤만 안 된다.

   #app 도 같이 늘어나야 한다. Preact 가 그리는 자리가 사이에 끼어 있어서,
   여기서 키를 안 물려주면 main 이 제 내용만큼만 서고 .collection-scroll 은
   flex-basis 0 그대로 높이 0 이 된다 — 굴러가기는 하는데 보이는 것이 없다 */
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
/* 끝까지 굴렸을 때 마지막 칸이 화면 밑동에 붙지 않게 여백을 둔다.
   껍데기 기본값(18px)은 손가락이 닿는 자리라 너무 얕다 */
.collection-scroll {display:block}
.dex-page .collection-scroll {padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.grid {display:grid;gap:var(--gap)}
/* 폴드 덮개(344) 에서 한 줄에 둘. 155px 이면 한 칸짜리 줄이 되어 카드 하나가
   화면을 다 먹는다 */
.dex-page .grid {grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.cell {display:block;width:100%;padding:0;text-align:left;color:inherit;font:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.face {display:block;position:relative;width:100%;aspect-ratio:2/3;background:var(--card2);overflow:hidden}
.face img {display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.ph {display:flex;align-items:center;justify-content:center;height:100%;padding:6px;
  color:var(--muted);font:10px/1.4 var(--sans);text-align:center;font-variant-numeric:tabular-nums}
.cap {display:block;font-weight:700;overflow-wrap:anywhere}
.cap i {display:block;margin-top:3px;font:400 11px var(--sans);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.search-row {display:grid;grid-template-columns:minmax(0,1fr);}
.search-row input {width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--text);font:inherit;border-radius:8px;padding:9px 11px;min-width:0}
.search-row input::placeholder {color:var(--muted)}
.search-row {grid-template-columns:minmax(0,1fr) auto;gap:8px}
.dex-reset {background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12px;min-height:40px}
.dex-view-row {display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.dex-view-row .sec {margin:0;flex-wrap:wrap;min-width:0}
.dex-view-row button {flex-shrink:0;min-height:44px}
.dex-view-row button[aria-pressed="true"] {border-color:var(--accent);color:var(--accent)}
.dex-view-tools {display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;flex-shrink:0}
.dex-filters {margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px}
.dex-filters summary {cursor:pointer;min-height:30px;font-weight:700;font-size:13px}
.dex-filter-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.dex-filter-grid label {display:grid;gap:5px;min-width:0;color:var(--muted);font-size:12px}
.dex-filter-grid select {width:100%;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);padding:6px;font:inherit}
.dex-filter-grid select:disabled {opacity:.5}
.dex-page .grid .cell .face img {object-fit:contain}
/* 칸이 천 장을 넘어도 화면 밖 칸은 그리지 않는다. 그리기 전 높이는 List 가 처음 보이는 칸을 재어
   --cell-h(그림 없는 칸)·--cell-h-art(그림 칸)로 준다 — 어림이 틀리면 목록 자리 되돌리기가 어긋난다.
   한 번 그린 칸은 auto 가 제 높이를 기억한다 */
.dex-page .grid>.cell {content-visibility:auto;contain-intrinsic-size:auto 150px auto var(--cell-h,320px)}
.dex-page .grid>.cell.has-art {contain-intrinsic-size:auto 150px auto var(--cell-h-art,360px)}
@media(min-width:720px){.dex-filter-grid {grid-template-columns:repeat(5,minmax(0,1fr))}}
.sw {display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px}
.sw button {flex:1 1 auto;background:var(--card);border:0;border-radius:6px;color:var(--muted);
  font:inherit;font-weight:700;font-size:12px;min-height:40px;padding:6px 10px}
.sw button.on {background:var(--accent-soft);color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.sec {margin:18px 0 8px;font:700 11px/1.6 var(--sans);color:var(--accent);font-variant-numeric:tabular-nums}
.sec span {color:var(--muted);font-weight:400;letter-spacing:0;margin-left:8px}
.note {margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.bar {display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.bar h2 {flex:1 1 auto;margin:0;font-size:19px;letter-spacing:-.02em;overflow-wrap:anywhere}
.bar .n {flex:none;font:700 11px var(--sans);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.back {flex:none;min-height:40px;padding:8px 12px;background:var(--card2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;font-weight:700}
/* 같은 열은 같은 장갑이다. 두 줄은 본문과 함께 굴려 작은 화면의 높이를 남긴다. */
.fstrip {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  padding:2px 1px 10px}
.fcell {min-width:0;padding:0;overflow:hidden;text-align:center;
  background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:10px;font:inherit}
.fcell .face {max-height:180px}
.fcell .face img {object-fit:contain;object-position:center}
.fcell.on {border-color:var(--accent);color:var(--text);box-shadow:inset 0 -3px var(--accent)}
.fcell.gap {opacity:.6;border-style:dashed}
.fcell b {display:block;padding:7px 4px 2px;font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.fcell u {display:block;padding:0 4px 7px;text-decoration:none;
  font:10px var(--sans);opacity:.8;font-variant-numeric:tabular-nums}
/* 2:3 을 그대로 두면 한 장이 화면을 다 먹고 그 밑의 연출컷·일상컷이 저 아래로
   밀린다 (폴드 덮개에서 474px, 펼친 화면에서는 963px). 화면 높이의 절반 아래로
   묶고 contain 으로 담는다 — 그림은 안 잘리고 옆에 띠가 생긴다.
   굴림 자리에 딱 맞추지는 않는다. 펼친 화면은 머리말이 커서 굴림 자리가 257px
   밖에 안 되는데, 거기 맞추면 덮개 화면의 그림까지 같이 작아진다 */
.big {position:relative;width:100%;aspect-ratio:2/3;max-height:46dvh;overflow:hidden;
  background:var(--card2);border:1px solid var(--line);border-radius:12px}
.big img {display:block;width:100%;height:100%;object-fit:contain}
/* 큰 그림 넘기기 — 좌우 화살표·방향키·밀기로 이 카드의 그림을 차례로, 끝을 넘으면 앞·다음 카드로(myth 도감과 같은 손).
   세로 굴림은 그대로(pan-y) */
.big {touch-action:pan-y;user-select:none;-webkit-user-select:none}
.big img {-webkit-user-drag:none}
.big-nav {position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 4px;pointer-events:none}
.big-nav button {pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;border:1px solid #ffffff40;border-radius:999px;background:#0009;color:#fff;font:400 22px/1 inherit;cursor:pointer}
.big-nav button:disabled {opacity:.2;cursor:default}
.big-nav button.to-card {border-color:var(--gold);color:var(--gold)}
/* 움직임 — 오버드라이브 그림에만 타입 입자가 떠도는 층. 넘기기 단추 밑, 그림 위(lib/scene-motion.js 가 캔버스를 단다) */
.dex-motion-layer {position:absolute;inset:0;pointer-events:none;overflow:hidden}
.big-count {position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:#000a;color:#fff;font:700 11px var(--num);pointer-events:none}
/* 카드 넘기기 — 큰 그림 바로 아래 한 줄: ‹ 앞 카드 · 몇 / 전체 · 다음 카드 › */
.card-nav {display:flex;align-items:center;gap:8px;margin-top:8px}
.card-nav button {flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.card-nav button span {min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .card-nav button b {flex:none;font-size:18px;font-weight:400}
.card-nav #dex-card-next {justify-content:flex-end}
.card-nav button:disabled {opacity:.35;cursor:default}
.card-nav .card-count {flex:none;font:700 11px var(--num);color:var(--muted);white-space:nowrap}
.legacy-overdrive {margin:16px 0;color:var(--muted);font-size:12px}
.legacy-overdrive summary {cursor:pointer;padding:10px 0}
.legacy-art {display:block;width:100%;max-height:46dvh;object-fit:contain}
/* 카드 값 — 제목과 값을 두 칸으로 놓는다. 좁은 화면에서도 안 겹치게 최소폭을 준다 */
.facts {display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;
  margin:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.facts dt {margin:0;color:var(--muted);font-size:11px;white-space:nowrap;align-self:center}
.facts dd {margin:0;font-size:13px;overflow-wrap:anywhere}
.facts dd b {font-weight:700}
/* 종족값 — 숫자만 늘어놓으면 어느 쪽이 높은지 안 읽힌다. 막대를 같이 둔다.
   가장 높은 값(255)을 꽉 찬 것으로 잡는다 */
.bars {display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;
  margin:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.bars span {color:var(--muted);font-size:11px;white-space:nowrap}
.bars i {display:block;height:7px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bars i u {display:block;height:100%;background:var(--accent);text-decoration:none}
.bars b {font:700 12px var(--num);text-align:right;min-width:3ch}
.bars .sum {border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
/* 진화 — 이름을 눌러 그 카드로 건너간다 */
.evo {display:flex;flex-wrap:wrap;gap:6px}
.evo button {min-height:34px;padding:5px 10px;background:var(--card2);color:var(--accent);
  border:1px solid var(--line);border-radius:999px;font:inherit;font-size:12px}
.tag {display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font:700 10px var(--sans);
  vertical-align:middle;font-variant-numeric:tabular-nums}
.gal {display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gal img {display:block;width:100%;border:1px solid var(--line);border-radius:8px}
.empty {padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
.hall-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}
.hall-controls button{padding:9px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.hall-controls button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hall-controls button:disabled{opacity:.55;cursor:default}.hall-n{font-size:11px;color:var(--muted)}
/* 즐겨찾기 — 진열 단추 앞의 하트(지금 보이는 그림 한 장), 담은 수는 공방 모음으로 가는 작은 링크 */
.hall-controls .fav-heart span{font-size:15px;line-height:1;margin-right:5px}
.hall-controls .fav-count{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--muted);font-size:12px;text-decoration:none;border-radius:8px}
.hall-controls .fav-count:hover{color:var(--text)}
.hall-controls button:focus-visible,.hall-controls .fav-count:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fav-toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:calc(100vw - 32px);padding:9px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;text-align:center;pointer-events:none}
.fav-toast:empty{display:none}
/* 도트 — 상세의 작은 무대(바닥 위를 거닌다, 누르면 반응), 목록 칸의 「도트」 표(「새」는 왼쪽 위라 오른쪽 위) */
.dex-dot{margin:14px 0 6px}.dex-dot[hidden]{display:none}
.dex-dot-stage{position:relative;height:150px;overflow:hidden;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--card) 0,var(--card) 74%,color-mix(in srgb,var(--line) 70%,var(--card)) 74%,var(--card) 100%)}
.dot-badge{position:absolute;right:5px;top:5px;z-index:2;padding:2px 7px;border-radius:999px;background:#18242ccc;color:#c3f0e8;font-size:10px;font-weight:800;letter-spacing:.04em;pointer-events:none}
</style>

<script src="lib/favorites.js?v=1"></script>
<!-- 도트 — lib/sprite-actor.js(공방 모음의 공용 재생기) · data/sprites.json. 도트가 있는 포켓몬은 목록 칸에 「도트」 표, 상세에 작은 무대 한 줄 -->

</head>
<body class="dex-page">
<div id="app"></div>
<script type="module">
/* Fragment 는 h 에 안 붙어 있다. h.Fragment 로 부르면 undefined 가 넘어가고
   preact 가 진짜 태그를 하나 만들어 버린다 — 격자(.facts)에서 그 태그가 칸을
   차지해서 제목과 값이 세로로 겹쳐 붙었다. 따로 들여온다 */
import { h, render, Fragment } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef, useLayoutEffect } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=status1';
import { modalFocus } from './lib/gallery.js?v=1';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, FILTER = window.AtelierDexFilter, MOTION = window.AtelierMotion, FAV = window.AtelierFavorites;
const FAV_HUB = '/favorites.html';
/* 즐겨찾기 목록 — 다른 탭(공방 모음)에서 빼도 따라온다 */
function useFavorites() {
  const [list, setList] = useState(() => (FAV ? FAV.list() : []));
  useEffect(() => (FAV ? FAV.onChange(setList) : undefined), []);
  return list;
}
/* 잠깐 떴다 사라지는 알림. 자리는 늘 깔아 둔다 — 화면 읽기 프로그램은 새로 생긴 칸의 말을 놓치기 쉽다 */
/* 도트 자료 — 한 번만 받는다(목록 표). 상세의 무대는 AtelierSprite.mount 가 같은 자료로 */
const SP = window.AtelierSprite;
function useSprites() {
  const [sp, setSp] = useState(null);
  useEffect(() => { let live = true; SP && SP.load('data/sprites.json').then(d => { if (live && d && d.actors) setSp(d); }, () => {}); return () => { live = false; }; }, []);
  return sp;
}
/* 도트 — 이 포켓몬의 도트가 있으면 작은 무대 한 줄(거닐고, 누르면 반응). 없거나 그림을 못 받으면 아무것도 없다 */
function DotRow({ card }) {
  const box = useRef(null), [on, setOn] = useState(false);
  useEffect(() => {
    if (!SP || !box.current) return;
    let live = true, a = null;
    /* mount 는 무대를 도트 크기만큼 늘린다(grow — 폴드처럼 화소 배율이 정수가 아니면 도트가 1.14배로 커져도 머리가 안 잘린다) */
    SP.mount(box.current, card.name, { label: W('dex.dot.actor', { name: card.name }) }).then(x => { if (!live) { if (x) x.destroy(); return; } a = x; setOn(!!x); });
    return () => { live = false; if (a) a.destroy(); setOn(false); };
  }, [card.name]);
  return html`<section class="dex-dot" hidden=${!on} data-card=${card.name} aria-labelledby="dex-dot-title">
    <p class="sec" id="dex-dot-title">${W('dex.dot.title')}<span>${W('dex.dot.note')}</span></p>
    <div class="dex-dot-stage" ref=${box}></div></section>`;
}
function useNote() {
  const [msg, setMsg] = useState(''), t = useRef(0);
  useEffect(() => () => clearTimeout(t.current), []);
  return [msg, s => { setMsg(s); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 2000); }];
}
const FILTER_STORE = 'pkm_dex_filters_v1';
/* 주소 — 거른 목록과 보던 카드를 링크로 남긴다. 기본값인 필터는 적지 않는다.
   ?mech=<카드 이름> 이 상세, 나머지(q·style·gen·type·form·cut)가 필터다 */
const URL_KEYS = Object.keys(FILTER.defaults());
function urlFilters() {
  const u = new URL(location.href);
  if (!URL_KEYS.some(k => u.searchParams.has(k))) return null;
  const raw = {};
  for (const k of URL_KEYS) { const v = u.searchParams.get(k); if (v !== null) raw[k] = v; }
  return FILTER.normalize(raw);
}
function dexHref(filters, mech) {
  const u = new URL(location.href), d = FILTER.defaults();
  for (const k of [...URL_KEYS, 'mech', 'pic']) u.searchParams.delete(k);
  if (mech) u.searchParams.set('mech', mech);
  for (const k of URL_KEYS) if (filters[k] && filters[k] !== d[k]) u.searchParams.set(k, filters[k]);
  return u.pathname + u.search + u.hash;
}
function setUrl(href, push) {
  if (href === location.pathname + location.search + location.hash && !push) return;
  try { history[push ? 'pushState' : 'replaceState'](push ? { dex: 'card' } : history.state, '', href); } catch {}
}
/* 그리기 전 칸 높이 — 그림 칸·빈 칸 하나씩 잠깐 그려 잰다(늘어나지 않게 align-self:start) */
function measureCells(grid) {
  if (!grid) return;
  for (const [sel, name] of [['.cell.has-art', '--cell-h-art'], ['.cell:not(.has-art)', '--cell-h']]) {
    const c = grid.querySelector(':scope > ' + sel);
    if (!c) continue;
    c.style.contentVisibility = 'visible'; c.style.alignSelf = 'start';
    const hgt = c.getBoundingClientRect().height;
    c.style.contentVisibility = ''; c.style.alignSelf = '';
    if (hgt > 0) grid.style.setProperty(name, hgt.toFixed(1) + 'px');
  }
}

/* 최근 추가 · 새 그림 — 날짜는 img.json 의 added 에서 온다(등록기가 UTC 날짜로 적는다. 날짜 없는 그림은 어디에도 안 오른다).
   띠는 UTC 로 최근 7일, 새로운 것부터 24장까지. 같은 날은 들어온 시각(added_at)이 늦은 것부터, 시각이 없으면 도감 번호 차례.
   "새" 는 이 브라우저의 지난 방문 뒤에 들어온 그림이다. 방문 기록은 시계가 아니라 자료로 적는다 —
   떠날 때 그때 자료의 가장 늦은 날(mark)과 그날 그림(known)을 적어 두고, 다음 방문에는 mark 보다 늦거나
   mark 날인데 known 에 없는 그림을 "새" 로 본다. 등록기는 늘 오늘 날짜를 붙이므로 기기 시계·시간대가 틀려도 안 어긋난다.
   기준은 이 탭에서 처음 연 때 sessionStorage 에 잡아 두고 끝까지 쓴다 — 떠날 때(pagehide·숨김) 기록을 고쳐도
   보는 동안 표시가 사라지지 않는다. 처음 온 브라우저는 기준이 없으니 아무것도 "새" 가 아니다 */
const RECENT_DAYS = 7, RECENT_MAX = 24, DAY_MS = 864e5;
const SEEN_STORE = 'pkm_dex_seen_v1', SINCE_SESSION = 'pkm_dex_since_v1';
const isDay = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
function readStore(store, key) { try { return JSON.parse(store.getItem(key)); } catch { return null; } }
function dataMark() {
  const all = IMG.addedAll(); let mark = '';
  for (const f in all) if (all[f] > mark) mark = all[f];
  return { mark, known: Object.keys(all).filter(f => all[f] === mark).sort() };
}
function visitBaseline() {
  let base = readStore(sessionStorage, SINCE_SESSION);
  if (!base || typeof base !== 'object') {
    const prev = readStore(localStorage, SEEN_STORE);
    base = prev && isDay(prev.mark) ? { mark: prev.mark, known: Array.isArray(prev.known) ? prev.known : [] } : { mark: '' };
    try { sessionStorage.setItem(SINCE_SESSION, JSON.stringify(base)); } catch {}
  }
  return isDay(base.mark) ? { mark: base.mark, known: new Set(Array.isArray(base.known) ? base.known : []) } : null;
}
function rememberVisit() {
  const now = dataMark(), prev = readStore(localStorage, SEEN_STORE);
  if (!now.mark || (prev && isDay(prev.mark) && prev.mark > now.mark)) return;   /* 날짜 없는 자료·캐시의 옛 자료로 기록을 뒤로 돌리지 않는다 */
  try { localStorage.setItem(SEEN_STORE, JSON.stringify(now)); } catch {}
}
function recentShots(st) {
  const from = new Date(Date.now() - (RECENT_DAYS - 1) * DAY_MS).toISOString().slice(0, 10), out = [];
  for (const card of st.cards) {
    const entry = st.img[card.name];
    if (!entry) continue;
    for (const s of FILTER.shots(entry, st.defs)) { const day = IMG.addedOf(s.file); if (day && day >= from) out.push({ ...s, card, day, at: IMG.addedAtOf(s.file) || '' }); }
  }
  /* 새 날짜부터. 같은 날은 늦게 들어온 시각부터(added_at — 한날 수백 장이면 날짜만으로는 도감 번호 차례가 되어 방금 들어온 그림이 밀렸다), 시각이 같거나 없으면 도감 번호 차례 */
  out.sort((a, b) => a.day < b.day ? 1 : a.day > b.day ? -1 : a.at < b.at ? 1 : a.at > b.at ? -1 : a.card.no - b.card.no);
  return out.slice(0, RECENT_MAX);
}
function NewBadge({ title }) {
  return html`<span class="new-badge" title=${title}>${W('dex.new.badge')}</span>`;
}

/* 지금 만드는 것은 여성체뿐이다. 그래도 파일 이름에는 _f 를 적어 두므로,
   나중에 m 을 더해도 옛 파일의 뜻이 안 바뀐다. 완료 판정은 성별을 안 본다 */
const V = 'f';

/* 썸네일을 먼저 걸고 없으면 원본으로 되돌아간다.
   thumbTag 는 문자열을 만드는 함수라 Preact 에서는 못 쓴다 — 같은 규칙을 여기 둔다 */
function Pic({ file, full, alt }) {
  const [failed, setFailed] = useState(false), image = useRef();
  useLayoutEffect(() => { setFailed(false); if (image.current) delete image.current.dataset.fallback; }, [file]);
  if (failed) return html`<span class="image-status" role="status">${W('gallery.image.error')}</span>`;
  return html`<img ref=${image} width="800" height="1200" decoding="async" loading=${full ? 'eager' : 'lazy'} alt=${alt || ''}
    src=${full ? IMG.imgURL(file) : IMG.thumbURL(file)}
    onError=${e => {
      const t = e.currentTarget;
      if (full || t.dataset.fallback) { setFailed(true); return; }
      t.dataset.fallback = '1';
      t.src = IMG.imgURL(file);
    }} />`;
}

/* 껍데기. lib/workspace.css 의 .dex-page 규칙이 화면을 100dvh 로 잠그고
   .collection-scroll 한 곳만 구르게 한다 — 그 자리를 안 쓰면 아래쪽이 통째로
   잘리고, 화면은 멀쩡해 보이는데 스크롤만 안 된다.
   굴리면 main 에 dex-scrolled 가 붙어 검색 도구가 간결해지고 머리말도 접힌다(.dex-fold — 휴대폰에서는 문양 + 제목 한 줄).
   항해 탭은 남는다. 맨 위 근처로 돌아오면 펼친다 — 접고 펴는 사이를 두어 경계에서 깜빡이지 않게 한다 */
function Shell({ head, children }) {
  const [scrolled, setScrolled] = useState(false);
  return html`<main class=${'dex-fold' + (scrolled ? ' dex-scrolled' : '')}>
    <${WorkspaceHeader} page="dex" />
    <header>${head}</header>
    <div class="collection-scroll" tabindex="0"
      onScroll=${e => { const t = e.currentTarget.scrollTop; setScrolled(v => t > 24 ? true : t < 4 ? false : v); }}>
      ${children}
    </div>
  </main>`;
}

function useDex() {
  const [state, set] = useState({ loading: true });
  useEffect(() => {
    Promise.all([
      fetch('data/card.json', { cache: 'no-cache' }).then(r => r.json()),
      fetch('data/style.json', { cache: 'no-cache' }).then(r => r.json()),
      IMG.load(),
      fetch('data/group.json', { cache: 'no-cache' }).then(r => r.json()),
      fetch('data/label.json', { cache: 'no-cache' }).then(r => r.json()),
    ]).then(([card, style, img, group, label]) => {
      const cards = [];
      for (const kind of Object.keys(card.cards || {}))
        for (const c of card.cards[kind]) cards.push(Object.assign({ kind }, c));
      const styleName = {};
      for (const r of style.styles || []) styleName[r.key] = r.name;
      set({ cards, defs: card.forms || {}, styleName, img, group, label });
    }).catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}

/* 장갑 선택과 폭주 상태는 별개다. 도감의 그림 자리만 일반 셋 + 폭주 셋으로 편다. */
function wanted(defs, card) {
  const want = (card.forms && card.forms.length) ? card.forms : Object.keys(defs);
  const normal = want.filter(k => defs[k] && k !== 'overdrive');
  return normal.concat(normal.map(k => k + '_overdrive'));
}
function baseForm(form) { return form.replace(/_overdrive$/, ''); }
function formName(defs, form) {
  const name = W(defs[baseForm(form)].word);
  return form.endsWith('_overdrive') ? W('form.overdriveOf', { form: name }) : name;
}

/* 진척은 화풍마다 따로다(화풍을 섞어 견주지 않는다). 가장 많이 채운 화풍을
   목록의 대표로 삼는다 */
function bestStyle(entry, want) {
  let best = { style: '', prog: { done: 0, all: want.length, left: want.slice(), ok: !want.length } };
  for (const k of IMG.styleKeys(entry || {})) {
    const prog = IMG.formsDone(IMG.styleMap(entry)[k], want, V);
    if (!best.style || prog.done > best.prog.done) best = { style: k, prog };
  }
  return best;
}

/* 카드가 들고 있는 값. 없는 값은 줄 자체를 안 만든다 —
   "진화: 없음" 을 1,025장에 늘어놓아 봐야 읽을 것만 늘어난다 */
function Facts({ card, group, label, onJump }) {
  const gname = k => (group.name || {})[k] || k;
  const el = [card.element, card.element2].filter(Boolean).map(gname).join(' · ');
  const rows = [
    [W('card.no'), html`<b>No.${String(card.no).padStart(4, '0')}</b>
      ${' '}${W('card.gen', { n: card.gen })}
      ${card.rare && html`<span class="tag">${W('card.rare.' + card.rare)}</span>`}`],
    [W('group.one'), el],
    card.genus && [W('kind.character'), card.genus],
    card.h !== undefined && [W('card.size'),
      W('card.height', { n: card.h }) + ' · ' + W('card.weight', { n: card.w })],
    card.color && [W('card.color'), (label.color || {})[card.color] || card.color],
    card.shape && [W('card.shape'), (label.shape || {})[card.shape] || card.shape],
    card.egg && [W('card.egg'), card.egg.map(k => (label.egg || {})[k] || k).join(' · ')],
  ].filter(Boolean);

  const evo = [];
  if (card.from) evo.push([W('card.evo.from'), [card.from]]);
  if (card.to) evo.push([W('card.evo.to'), card.to]);

  /* 종족값은 255 가 가장 높다. 그 값을 꽉 찬 것으로 잡아야 카드끼리 견줄 수 있다 */
  const stats = card.stats || [];
  const names = label.stat || [];
  return html`
    <dl class="facts">
      ${rows.map(([k, v]) => html`<${Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`)}
      ${evo.map(([k, list]) => html`<${Fragment} key=${k}>
        <dt>${W('card.evo')} ${k}</dt>
        <dd><div class="evo">${list.map(n =>
          html`<button key=${n} onClick=${() => onJump(n)}>${n}</button>`)}</div></dd><//>`)}
      ${card.text && html`<${Fragment}><dt>${W('card.text')}</dt><dd>${card.text}</dd><//>`}
    </dl>
    ${stats.length > 0 && html`<div class="bars" role="group" aria-label=${W('card.stats')}>
      ${stats.map((n, i) => html`<${Fragment} key=${i}>
        <span>${names[i] || i}</span>
        <i><u style=${'width:' + Math.round(n / 255 * 100) + '%'}></u></i>
        <b>${n}</b><//>`)}
      <span class="sum">${W('card.total')}</span>
      <i class="sum"></i>
      <b class="sum">${stats.reduce((a, b) => a + b, 0)}</b>
    </div>`}`;
}

function Detail({ card, entry, defs, styleName, group, label, selection, nav, onGo, onClose, onJump, isNew }) {
  const [zoom, setZoom] = useState(!!selection?.zoom);
  const [hall,setHall]=useState(()=>IMG.hallPicks());
  useEffect(()=>{const update=()=>setHall(IMG.hallPicks());
    for(const e of ['atelier-appearance','atelier-hall','storage'])addEventListener(e,update);
    return()=>{for(const e of ['atelier-appearance','atelier-hall','storage'])removeEventListener(e,update);};},[]);
  const inHall=hall.includes(card.name),hallFull=!inHall&&hall.length>=IMG.HALL_MAX;

  const want = wanted(defs, card);
  const keys = IMG.styleKeys(entry || {});
  if(FILTER.shots(entry,defs).some(s=>!s.style))keys.push('');
  const [wantStyle, setStyle] = useState(selection?.style || '');
  const [focus, setFocus] = useState(selection?.file ? selection : null);
  const [wantForm, setForm] = useState(selection?.form || '');
  const style = keys.indexOf(wantStyle) >= 0 ? wantStyle : (bestStyle(entry, want).style || keys[0] || '');
  const bucket = (style ? IMG.styleMap(entry)[style] : entry) || {};
  const prog = IMG.formsDone(bucket, want, V);
  /* 고르개에는 그림이 있는 폼만 올린다. 빈 폼을 고를 수 있게 두면
     눌렀을 때 아무 일도 안 일어나는 단추가 된다 */
  const have = want.filter(k => { const b = IMG.formOf(bucket, k); return !!(b && b[V]); });
  const form = have.indexOf(wantForm) >= 0 ? wantForm : (have[0] || '');
  const acts = form ? IMG.formActs(bucket, form, V) : [];
  const casual = IMG.cuts(bucket, 'casual', V);
  const legacy = IMG.formOf(bucket, 'overdrive');
  /* 넘기는 차례 — 이 화풍의 폼 초상(일반 셋 → 폭주 셋) → 폼마다 연출컷 → 일상컷 */
  const shots = have.map(k => ({ file: IMG.formOf(bucket, k)[V], cut: 'portrait', form: k }))
    .concat(have.flatMap(k => IMG.formActs(bucket, k, V).map((f, i) => ({ file: f, cut: 'action', form: k, index: i + 1 }))))
    .concat(casual.map((f, i) => ({ file: f, cut: 'casual', index: i + 1 })));
  const showFocus = !!focus && (focus.cut !== 'portrait' || !have.includes(focus.form));
  const shownFile = showFocus ? focus.file : form ? IMG.formOf(bucket, form)[V] : null;
  const at = shots.findIndex(x => x.file === shownFile);   /* -1 — 목록에서 고른 특별컷·옛 폭주처럼 차례 밖 */
  const apply = n => { if (n.cut === 'portrait') { setForm(n.form); setFocus(null); } else { if (n.form) setForm(n.form); setFocus(n); } };
  const prevCard = nav && nav.prev, nextCard = nav && nav.next;
  const prevShot = at < 0 ? shots.length > 0 : at > 0, nextShot = at < 0 ? shots.length > 0 : at < shots.length - 1;
  const canPrev = prevShot || !!prevCard, canNext = nextShot || !!nextCard;
  /* 한 칸 — 그림 차례 안이면 그림, 끝을 넘으면 앞 카드(그 마지막 그림)·다음 카드(첫 그림)로 */
  const move = d => { const i = at < 0 ? (d > 0 ? -1 : shots.length) : at, n = shots[i + d];
    if (n) return apply(n);
    if (d < 0 && prevCard) onGo(prevCard, 'last', '.big', zoom); if (d > 0 && nextCard) onGo(nextCard, 'first', '.big', zoom); };
  /* 카드를 넘어 왔으면 그 끝 그림에서 시작하고, 누른 자리(큰 그림 또는 카드 줄)를 화면의 같은 높이에 둔다 —
     새로 그려지며 맨 위로 튀면 휴대폰에서 누르던 단추가 화면 밖으로 밀린다 */
  useLayoutEffect(() => {
    if (selection?.at === 'last' && shots.length) apply(shots[shots.length - 1]);
    const k = selection?.keep, sc = document.querySelector('.collection-scroll'), el = k && document.querySelector(k.sel);
    if (sc && el) sc.scrollTop += el.getBoundingClientRect().top - k.y;
  }, []);
  /* 방향키 — 셀렉트 같은 입력칸에 있을 땐 그 칸 몫 */
  const liveMove = useRef(); liveMove.current = move;
  useLayoutEffect(() => {
    const key = e => { if (document.querySelector('.zoom-layer') || e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('input, select, textarea'))) return;
      if (e.key === 'ArrowLeft') liveMove.current(-1); if (e.key === 'ArrowRight') liveMove.current(1); };
    addEventListener('keydown', key);
    return () => removeEventListener('keydown', key);
  }, []);
  const swipe = useSwipe(d => liveMove.current(d), () => setZoom(true));
  const bigNav = (shots.length > 1 || prevCard || nextCard) && html`<div class="big-nav">
      <button type="button" class=${'big-prev' + (!prevShot && prevCard ? ' to-card' : '')} disabled=${!canPrev} onClick=${() => move(-1)}
        aria-label=${!prevShot && prevCard ? W('dex.card.prev') + ' · ' + prevCard.name : W('dex.shot.prev')}>‹</button>
      <button type="button" class=${'big-next' + (!nextShot && nextCard ? ' to-card' : '')} disabled=${!canNext} onClick=${() => move(1)}
        aria-label=${!nextShot && nextCard ? W('dex.card.next') + ' · ' + nextCard.name : W('dex.shot.next')}>›</button>
    </div>`;
  const bigCount = shots.length > 1 && at >= 0 && html`<span class="big-count" aria-live="polite">${at + 1} / ${shots.length}</span>`;
  /* 움직임(lib/scene-motion.js) — 큰 그림에 켄 번스. 같은 장갑의 폼 ↔ 그 오버드라이브는 열리기(오버드라이브로 갈 때만
     그 종의 타입 입자가 터진다), 나머지 그림 바꾸기는 넘기기. 오버드라이브 그림에만 타입 입자가 옅게 떠돈다.
     크게 보기는 살펴보는 자리라 켄 번스·입자 없음. 나가는 그림은 바뀌기 직전(그리는 때)에 주소와 변형을 떠 둔다 */
  const bigRef = useRef(null), lastShown = useRef(null), outgoing = useRef(null);
  const [motion, setMotion] = useState(() => !!MOTION && MOTION.enabled());
  useEffect(() => MOTION ? MOTION.subscribe(setMotion) : undefined, []);
  const motionLocked = !MOTION || MOTION.reduced();
  const shownForm = showFocus ? focus.form || '' : form;
  const ambient = !!shownFile && /_overdrive$/.test(shownForm) ? FILTER.particlesOf(card) : null;
  if (MOTION && lastShown.current && lastShown.current.file !== shownFile && !outgoing.current) outgoing.current = MOTION.snapshot(bigRef.current);
  useLayoutEffect(() => {
    const prev = lastShown.current, snap = outgoing.current, img = bigRef.current && bigRef.current.querySelector('.zoom img');
    const now = shownFile ? { file: shownFile, form: shownForm, cut: showFocus ? focus.cut : 'portrait', at } : null;
    outgoing.current = null;
    /* 앞 카드에서 넘어오면 처음 그림은 곧 마지막 그림으로 바뀐다 — 그 사이는 넘기기가 아니다 */
    if (!prev && selection?.at === 'last' && shots.length && shots[shots.length - 1].file !== shownFile) return;
    lastShown.current = now;
    if (!MOTION || !now || !img) return;
    const kenBurns = { el: img, seed: now.file };
    if (!prev || !snap || prev.file === now.file) { MOTION.kenBurns(img, { seed: now.file }); return; }
    MOTION.stop(img);
    const ghost = MOTION.ghost(img, snap.src, { fit: 'contain', transform: snap.transform });
    const pair = prev.cut === 'portrait' && now.cut === 'portrait' && prev.form !== now.form && baseForm(prev.form) === baseForm(now.form);
    if (pair) MOTION.reveal(ghost, img, { kind: /_overdrive$/.test(now.form) ? FILTER.particlesOf(card) : null, removeFrom: true, key: 'dex-big', seed: now.file, kenBurns });
    else MOTION.turn(ghost, img, { direction: prev.at >= 0 && now.at >= 0 && now.at < prev.at ? 'previous' : 'next', removeFrom: true, key: 'dex-big', kenBurns });
  }, [shownFile]);

</section>

/* 밀어 넘기기 — 가로로 40px 넘게, 세로보다 확실히 많이 끌면 한 칸(손가락이 왼쪽으로 가면 다음).
   10px 넘게 끈 손가락 뒤에 따라오는 click 은 삼킨다. 화살표 단추에서 시작한 건 단추 몫 (myth 도감과 같다) */
function useSwipe(onMove, onTap) {
  const live = useRef(); live.current = { onMove, onTap };
  const ate = useRef(0);
  return {
    onPointerDown: e => {
      ate.current = 0;
      if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.big-nav button, .zoom-nav button')) return;
      const x = e.clientX, y = e.clientY, id = e.pointerId;
      const up = u => { if (u.pointerId !== id) return; removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        if (u.type !== 'pointerup') return;
        const dx = u.clientX - x, dy = u.clientY - y;
        if (Math.hypot(dx, dy) > 10) ate.current = Date.now();
        if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.5) live.current.onMove(dx < 0 ? 1 : -1);
        else if (e.pointerType === 'touch' && Math.hypot(dx, dy) <= 10 && live.current.onTap) { ate.current = Date.now(); live.current.onTap(); } };
      addEventListener('pointerup', up); addEventListener('pointercancel', up);
    },
    onClickCapture: e => { if (Date.now() - ate.current < 500) { ate.current = 0; e.preventDefault(); e.stopPropagation(); } },
    onDragStart: e => e.preventDefault(),
  };
}

function Zoom({ card, shots, at, canPrev, canNext, onMove, onClose, defs }) {
 const layer=useRef(),live=useRef();live.current={onMove,onClose};
 useLayoutEffect(()=>modalFocus(layer.current,()=>live.current.onClose(),'.big .zoom'),[]);
 useLayoutEffect(()=>{const key=e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();live.current.onMove(e.key==='ArrowLeft'?-1:1);}};addEventListener('keydown',key);return()=>removeEventListener('keydown',key);},[]);
 const swipe=useSwipe(d=>live.current.onMove(d)),shot=shots[at];
 /* 원본 크기 — 그림을 제 픽셀 크기로 펼쳐 손가락·휠로 구석구석 본다. 예전엔 그림 파일을 새 창으로 열었는데,
    홈 화면 앱(허브 범위 /)에서는 같은 앱 창에 그림만 떠서 돌아올 길이 없었다(2026-10-20). 넘기면 다시 화면에 맞춘다 */
 const [actual,setActual]=useState(false);
 useEffect(()=>setActual(false),[shot&&shot.file]);
 return html`<div ref=${layer} class="zoom-layer" role="dialog" aria-modal="true" aria-label=${W('gallery.zoom')}>
  <div class="zoom-bar"><b>${card.name} · ${shotLabel(shot,defs)}</b><span aria-live="polite">${at+1} / ${shots.length}</span><button type="button" class="zoom-open" aria-pressed=${actual} onClick=${()=>setActual(v=>!v)}>${W(actual?'gallery.fit':'gallery.original')}</button><button class="zoom-close" data-dialog-close onClick=${onClose} aria-label=${W('gallery.close')}>✕</button></div>
  <div class=${'zoom-body'+(actual?' actual':'')} ...${actual?{}:swipe}><${Pic} full file=${shot.file} alt=${card.name+' · '+shotLabel(shot,defs)} /><div class="zoom-nav"><button class="zoom-prev" disabled=${!canPrev} onClick=${()=>onMove(-1)} aria-label=${W('gallery.previous')}>‹</button><button class="zoom-next" disabled=${!canNext} onClick=${()=>onMove(1)} aria-label=${W('gallery.next')}>›</button></div></div>
  <div class="zoom-footer"><span class="viewer-keyboard">${W('gallery.viewer.hint')}</span><span class="viewer-touch">${W('gallery.viewer.touch')}</span></div>
 </div>`;
}

function shotLabel(shot, defs) {
  const form = shot.form === 'overdrive' ? W('dex.form.legacy') :
    shot.form && defs[baseForm(shot.form)] ? formName(defs, shot.form) : '';
  const cut = W('dex.cut.' + shot.cut);
  return [form, shot.index ? W('dex.cut.number', {cut, n:shot.index}) : cut].filter(Boolean).join(' · ');
}
/* 최근 추가 띠 — 목록 맨 위. 띠 안에서만 옆으로 구른다(세로 굴림은 .collection-scroll 하나 그대로). 누르면 그 카드를 그 그림으로 연다 */
function Recent({ st, isNew, onOpen }) {
  const list = useMemo(() => recentShots(st), [st]);
  if (!list.length) return null;
  return html`<section class="recent" aria-labelledby="dex-recent-title">
    <p class="sec" id="dex-recent-title">${W('dex.recent.title')}<span>${W('dex.recent.count', { days: RECENT_DAYS, n: list.length })}</span></p>
    <div class="recent-strip" role="group" aria-labelledby="dex-recent-title">${list.map(s => {
      const fresh = isNew(s.file);
      return html`<button key=${s.file} type="button" class="recent-item" data-card=${s.card.name} data-file=${s.file} data-day=${s.day}
        aria-label=${W('dex.recent.item', { name: s.card.name, shot: shotLabel(s, st.defs), date: s.day }) + (fresh ? ' · ' + W('dex.new.file') : '')}
        onClick=${() => onOpen(s)}>
        <span class="face"><${Pic} file=${s.file} />${fresh && html`<${NewBadge} />`}</span>
        <span class="recent-name">${s.card.name}</span><i>${s.day.slice(5)}</i>
      </button>`;
    })}</div>
  </section>`;

function List({ st, filters, onFilter, onOpen, compact, onCompact, restore, select, rowNew, isNew, newCount, newOnly, onNewOnly }) {
  const sprites = useSprites();
  const f = FILTER.normalize(filters, st);
  const [filtersOpen, setFiltersOpen] = useState(false), gridRef = useRef();
  /* 상세에서 돌아오면 열기 전에 굴려 둔 자리로. 상세에서 다른 카드로 넘어갔으면 그 카드 칸이 보이게 한 번 더 민다 */
  useLayoutEffect(() => {
    measureCells(gridRef.current);
    const r = restore && restore.current, sc = document.querySelector('.collection-scroll');
    if (!r || !sc) return;
    restore.current = null;
    sc.scrollTop = r.top;
    if (!r.card) return;
    const el = [...sc.querySelectorAll('.grid > .cell')].find(x => x.dataset.card === r.card);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (r.card === r.from) return;
    const a = el.getBoundingClientRect(), b = sc.getBoundingClientRect();
    if (a.top < b.top || a.bottom > b.bottom) sc.scrollTop += a.top - b.top - Math.max(0, (b.height - a.height) / 2);
  }, []);
  const shown = useMemo(() => select(filters), [st, filters, newOnly]);
  /* 칸 높이 어림 — 폭(화면·작게 보기)이 바뀌거나 글꼴이 늦게 오면 다시 잰다 */
  useLayoutEffect(() => {
    const grid = gridRef.current;
    measureCells(grid);
    if (!grid || typeof ResizeObserver !== 'function') return;
    const probe = grid.firstElementChild;
    let w = probe.clientWidth;
    const ro = new ResizeObserver(() => { if (probe.clientWidth !== w) { w = probe.clientWidth; measureCells(grid); } });
    ro.observe(probe);
    document.fonts && document.fonts.ready && document.fonts.ready.then(() => measureCells(grid));
    return () => ro.disconnect();
  }, [compact, shown.length > 0]);
  const update = (key,value) => onFilter(FILTER.normalize({...f,[key]:value},st));
  const reset = () => { onFilter(FILTER.defaults()); onNewOnly(false); };
  const generations = [...new Set(st.cards.map(c => c.gen))].sort((a,b)=>a-b);
  const types = [...new Set(st.cards.flatMap(c => [c.element,c.element2]).filter(Boolean))];
  const typeOrder = st.group.order || types;
  types.sort((a,b)=>typeOrder.indexOf(a)-typeOrder.indexOf(b));
  const all = ['',W('dex.filter.all')];
  const pick = (key,options,disabled=false) => html`<label for=${'dex-'+key}>${W('dex.filter.'+key)}
    <select id=${'dex-'+key} value=${f[key]} disabled=${disabled} onChange=${e=>update(key,e.currentTarget.value)}>
      ${options.map(([v,label])=>html`<option key=${v} value=${v}>${label}</option>`)}
    </select></label>`;
  const head = html`<div class="search-row">
    <input type="search" name="q" autocomplete="off" enterkeyhint="search" spellcheck=${false} value=${f.q} placeholder=${W('dex.filter.search.hint')} aria-label=${W('dex.filter.search')}
      onInput=${e => update('q',e.currentTarget.value)} />
    <button class="dex-reset" id="dex-reset" onClick=${reset}>${W('dex.filter.reset')}</button>
  </div>`;
  return html`<${Shell} head=${head}>
    <section class="gallery-intro"><div><h2>${W('gallery.title')}</h2></div><p>${W('gallery.note')}</p></section>
    <${Recent} st=${st} isNew=${isNew} onOpen=${onOpen} />
    <div class="genre-strip" role="group" aria-label=${W('dex.filter.gen')}>${[all,...generations.map(n=>[String(n),W('card.gen',{n})])].map(([key,label])=>html`<button type="button" aria-pressed=${f.gen===key} onClick=${()=>update('gen',key)}>${label}</button>`)}</div>
    <details class="dex-filters" open=${filtersOpen} onToggle=${e=>setFiltersOpen(e.currentTarget.open)}>
      <summary>${W('dex.filter.title')}</summary>
      <div class="dex-filter-grid">
        ${pick('style',[all,...Object.entries(st.styleName)])}
        ${pick('gen',[all,...generations.map(n=>[String(n),W('card.gen',{n})])])}
        ${pick('type',[all,...types.map(k=>[k,st.group.name[k]||k])])}
        ${pick('cut',FILTER.CUTS.map(k=>[k,W('dex.cut.'+k)]))}
        ${pick('form',[all,...FILTER.forms(st.defs).map(k=>[k,k==='overdrive'?W('dex.form.legacy'):formName(st.defs,k)])],['base','casual','extra'].includes(f.cut))}
      </div>
      <p class="note">${W('dex.filter.note')} ${W('dex.filter.formNote')}</p>
    </details>
    <div class="dex-view-row"><p class="sec" role="status">${W('kind.character')}<span>${W('dex.filter.count',{
      cards:new Set(shown.map(r=>r.card.name)).size,images:shown.filter(r=>r.file).length})}</span></p>
      <div class="dex-view-tools">
        ${(newCount > 0 || newOnly) && html`<button class="dex-reset" id="dex-new-only" aria-pressed=${newOnly} title=${W('dex.new.file')} onClick=${() => onNewOnly(!newOnly)}>${W('dex.new.only')}</button>`}
        <button class="dex-reset" id="dex-size" aria-pressed=${compact} onClick=${onCompact}>${W(compact?'dex.view.normal':'dex.view.small')}</button>
      </div>
    </div>
    ${shown.length === 0
      ? html`<p class="empty">${W('dex.filter.empty')}</p>`
      : html`<div class="grid" ref=${gridRef}>${shown.map((shot,i) => {
          const c=shot.card,entry=st.img[c.name],want=wanted(st.defs,c);
          const prog=IMG.formsDone(shot.style?IMG.styleMap(entry)[shot.style]:entry,want,V),fresh=rowNew(shot,f);
          return html`<button key=${c.name+'-'+shot.style+'-'+shot.file+'-'+i} class=${shot.file?'cell has-art':'cell'}
            data-card=${c.name} data-style=${shot.style} data-form=${shot.form} data-cut=${shot.cut} data-new=${fresh?'1':undefined}
            onClick=${() => onOpen(shot)}>
            <span class="face">${shot.file
              ? html`<${Pic} file=${shot.file} alt=${c.name+' · '+shotLabel(shot,st.defs)} />`
              : html`<span class="ph">${W('art.none')}</span>`}${fresh && html`<${NewBadge} title=${W(f.cut==='auto'?'dex.new.card':'dex.new.file')} />`}${SP && sprites && SP.actorFor(sprites, c.name) && html`<span class="dot-badge" title=${W('dex.dot.label')}>${W('dex.dot.badge')}</span>`}</span>
            <span class="cap"><span class="card-meta">${[c.element,c.element2].filter(Boolean).map(k=>st.group.name[k]||k).join(' · ')}<span>${String(c.no).padStart(4,'0')}</span></span><strong>${c.name}</strong>
              ${shot.file&&html`<i>${st.styleName[shot.style]||W('dex.style.unknown')}</i><i>${shotLabel(shot,st.defs)}</i>`}
              <i>${W('art.form.done',prog)}</i>
            </span>
          </button>`;
        })}</div>`}
  <//>`;
}

function App() {
  const st = useDex();
  const [open, setOpen] = useState(null);
  /* 새 그림 — 기준은 이 탭에서 한 번 잡는다. 기록은 떠날 때(pagehide·화면 숨김) 고친다 */
  const [since] = useState(visitBaseline);
  const [newOnly, setNewOnly] = useState(false);
  const isNew = file => { const d = IMG.addedOf(file); return !!(since && d && (d > since.mark || (d === since.mark && !since.known.has(file)))); };
  const newCards = useMemo(() => {
    const out = new Set();
    if (st.cards && since) for (const c of st.cards) if (FILTER.shots(st.img[c.name], st.defs).some(s => isNew(s.file))) out.add(c.name);
    return out;
  }, [st.cards, since]);
  const newCount = useMemo(() => since ? Object.keys(IMG.addedAll()).filter(isNew).length : 0, [st.cards, since]);
  /* 대표 이미지 칸은 카드를 대신하므로 그 카드의 그림 하나라도 새것이면, 컷을 고른 칸은 그 그림이 새것이면 */
  const rowNew = (shot, f) => f.cut === 'auto' ? newCards.has(shot.card.name) : isNew(shot.file);
  const select = fl => { const f = FILTER.normalize(fl, st), rows = FILTER.select(st, fl); return newOnly ? rows.filter(r => rowNew(r, f)) : rows; };
  useEffect(() => {
    if (!st.cards) return;
    const hide = () => { if (document.visibilityState === 'hidden') rememberVisit(); };
    addEventListener('pagehide', rememberVisit); document.addEventListener('visibilitychange', hide);
    return () => { removeEventListener('pagehide', rememberVisit); document.removeEventListener('visibilitychange', hide); };
  }, [st.cards]);
  const [compact,setCompact] = useState(() => {
    try {return localStorage.getItem('pkm_dex_compact_v1') === 'true';} catch {return false;}
  });
  useEffect(() => {
    document.body.classList.toggle('dex-compact',compact);
    try {localStorage.setItem('pkm_dex_compact_v1',String(compact));} catch {}
    return () => document.body.classList.remove('dex-compact');
  },[compact]);
  /* 필터 — 주소에 있으면 주소가, 없으면 이 브라우저에 둔 것이. 바꾸면 둘 다 고친다(주소는 기록을 안 쌓는다) */
  const [filters,setFilters] = useState(() => {
    const fromUrl = urlFilters();
    if (fromUrl) return fromUrl;
    try { return FILTER.normalize(JSON.parse(localStorage.getItem(FILTER_STORE))); }
    catch { return FILTER.defaults(); }
  });
  const firstMech = useRef(new URL(location.href).searchParams.get('mech'));
  /* ?pic= — 즐겨찾기(공방 모음)에서 온 주소의 그림. 주소는 곧 목록 주소로 고쳐 쓰이므로 처음에 잡아 둔다 */
  const firstPic = useRef(new URL(location.href).searchParams.get('pic'));
  useEffect(() => {
    try {localStorage.setItem(FILTER_STORE,JSON.stringify(filters));} catch {}
    setUrl(dexHref(filters, openNow.current?.card?.name));
  }, [filters]);
  /* 목록 자리 — 열 때 굴린 값과 연 카드를 적어 두고, 닫을 때 List 가 그 자리로 돌아간다 */
  const listTop = useRef(0), from = useRef(null), restore = useRef(null), openNow = useRef(null);
  openNow.current = open;
  /* 휴대폰 뒤로 가기 — 상세를 열 때 기록을 한 칸 쌓아 두고(주소에 ?mech=<이름>), 뒤로 가기(popstate)면 그 칸을 내리며 목록으로.
     "목록으로" 단추도 같은 칸을 내린다(history.back). 그 popstate 는 이미 닫았으니 한 번 건너뛴다.
     카드를 넘기거나 진화로 건너가도 칸은 하나 그대로 주소만 바뀐다 — 뒤로 가기 한 번이면 목록이다.
     목록에서 앞으로 가기면 그 칸의 카드를 다시 연다 */
  const pushed = useRef(false), skipPop = useRef(false);
  const shut = () => { restore.current = { top: listTop.current, card: openNow.current?.card?.name, from: from.current }; setOpen(null); };
  const openShot = shot => {
    const sc = document.querySelector('.collection-scroll');
    listTop.current = sc ? sc.scrollTop : 0; from.current = shot.card.name;
    setOpen(shot);
    if (!pushed.current) { setUrl(dexHref(filters, shot.card.name), true); pushed.current = true; skipPop.current = false; }
  };
  useEffect(() => { if (open && pushed.current) setUrl(dexHref(filters, open.card.name)); }, [open?.card?.name]);
  const close = () => {
    shut();
    if (pushed.current) { pushed.current = false; skipPop.current = true; try { history.back(); } catch { skipPop.current = false; } }
  };
  const liveShut = useRef(); liveShut.current = shut;
  const liveForward = useRef(); liveForward.current = () => {
    const name = new URL(location.href).searchParams.get('mech'), c = st.cards && st.cards.find(x => x.name === name);
    if (!c || !history.state || history.state.dex !== 'card') return;
    const sc = document.querySelector('.collection-scroll');
    listTop.current = sc ? sc.scrollTop : 0; from.current = c.name; pushed.current = true; setOpen({ card: c });
  };
  useEffect(() => {
    const pop = () => { if (skipPop.current) { skipPop.current = false; return; } if (pushed.current) { pushed.current = false; liveShut.current(); } else liveForward.current(); };
    addEventListener('popstate', pop);
    return () => removeEventListener('popstate', pop);
  }, []);

  /* ?mech= 로 들어오면 — 이 칸은 목록 주소로 바꾸고, 그 위에 카드 칸을 쌓는다. 뒤로 가기면 같은 필터의 목록이다 */
  const linked=useRef(false);
  useEffect(()=>{
    if(!st.cards||linked.current)return;linked.current=true;
    const card=st.cards.find(c=>c.name===firstMech.current);
    /* ?pic= 가 있으면 그 그림의 화풍·폼·컷으로 연다 */
    const pic=firstPic.current;
    const shot=card&&pic&&FILTER.shots(st.img[card.name],st.defs).find(s=>s.file===pic);
    setUrl(dexHref(filters));
    if(card)openShot(shot?{...shot,card}:{card});
  },[st.cards]);

  if (st.error) return html`<${Shell} head=${null}>
    <p class="empty">${W('ui.error', { message: st.error })}</p><//>`;
  if (!st.cards) return html`<${Shell} head=${null}>
    <p class="empty">${W('ui.loading')}</p><//>`;

  const card = st.cards.find(c => c.name === open?.card?.name);
  if (card) {
    /* 카드 넘기기의 차례 — 지금 거른 목록의 차례에서 그림이 있는 카드만. 거른 목록에 없는 카드(진화로 건너온 것)면 번호 차례 전체 */
    const hasArt = c => FILTER.shots(st.img[c.name], st.defs).length > 0;
    const seen = new Set();
    let ring = select(filters).map(r => r.card).filter(c => !seen.has(c.name) && seen.add(c.name) && hasArt(c));
    if (!ring.some(c => c.name === card.name)) ring = st.cards.filter(c => c.name === card.name || hasArt(c)).sort((a, b) => a.no - b.no);
    const index = ring.findIndex(c => c.name === card.name);
    const nav = index < 0 ? null : { index, total: ring.length, prev: ring[index - 1] || null, next: ring[index + 1] || null };
    const go = (c, at, sel, zoom = false) => { const el = sel && document.querySelector(sel);
      setOpen({ card: c, style: open.style, at, zoom, keep: el ? { sel, y: el.getBoundingClientRect().top } : null }); };
    return html`<${Detail} key=${card.name} card=${card} entry=${st.img[card.name] || null}
      selection=${open} nav=${nav} onGo=${go} defs=${st.defs} styleName=${st.styleName} group=${st.group} label=${st.label}
      onClose=${close} isNew=${isNew}
      onJump=${n => { const next=st.cards.find(c=>c.name===n); if(next)setOpen({card:next,style:open.style}); }} />`;
  }
  return html`<${List} st=${st} filters=${filters} onFilter=${setFilters} onOpen=${openShot} restore=${restore}
    compact=${compact} onCompact=${()=>setCompact(v=>!v)} select=${select} rowNew=${rowNew} isNew=${isNew}
    newCount=${newCount} newOnly=${newOnly} onNewOnly=${setNewOnly} />`;
}

render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>
